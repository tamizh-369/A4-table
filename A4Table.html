<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Table Generator - Dark Edition</title>
    <!-- Include html2pdf library for the download feature -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Dark Theme */
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --card-bg: #1e293b;  /* Slate 800 */
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #94a3b8; /* Slate 400 */
            --accent-blue: #3b82f6; /* Blue 500 */
            --accent-blue-hover: #60a5fa; /* Blue 400 */
            --accent-green: #10b981; /* Emerald 500 */
            --accent-green-hover: #34d399; /* Emerald 400 */
            --border-color: #334155; /* Slate 700 */
            --input-bg: #0f172a;
        }

        /* General Page Styling */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        @keyframes paperAppear {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Control Panel UI */
        .controls {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            margin-bottom: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            width: 160px;
        }

        input, select {
            padding: 10px 14px;
            width: 120px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Button Styling */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .row-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 18px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, var(--accent-blue-hover), #3b82f6);
        }

        .btn-success { 
            background: linear-gradient(135deg, var(--accent-green), #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, var(--accent-green-hover), #10b981);
        }

        .btn-secondary { 
            background: #475569; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-secondary:hover { 
            background: #64748b; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Results Display */
        .results {
            margin-top: 25px;
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.6;
            display: none;
            border-left: 4px solid var(--accent-blue);
            color: var(--text-main);
            animation: fadeInUp 0.4s ease forwards;
        }
        .results strong { color: var(--accent-blue-hover); }

        /* A4 Paper Container Preview */
        .a4-wrapper {
            animation: paperAppear 0.8s ease 0.2s forwards;
            opacity: 0;
            /* Creates a nice glowing backdrop behind the paper */
            position: relative;
        }

        .a4-wrapper::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(167, 139, 250, 0.2));
            filter: blur(20px);
            z-index: -1;
            border-radius: 10px;
        }

        .a4-container {
            background: white;
            color: black;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            /* The magic transition that smoothly animates portrait <-> landscape */
            transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                        height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        /* Table Styling for Preview */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            /* Fade animation when regenerating the table */
            animation: fadeInUp 0.4s ease;
        }
        td {
            border: 1px solid #333; /* Darker border for better visibility on white */
            box-sizing: border-box;
            text-align: center;
            transition: background-color 0.2s ease;
        }
        td:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Print Settings: Strictly standard A4 White output */
        @media print {
            body {
                margin: 0;
                padding: 0;
                background-color: white !important;
                display: block;
            }
            .controls, .a4-wrapper::before { display: none !important; }
            .a4-wrapper { 
                animation: none !important; 
                opacity: 1 !important; 
            }
            .a4-container {
                margin: 0;
                box-shadow: none !important;
                position: absolute;
                top: 0; left: 0;
                page-break-after: always;
                transition: none !important; /* Disable animations for print */
            }
            table { animation: none !important; }
            td { border: 1px solid black !important; background-color: white !important; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>A4 Table Generator</h2>
        
        <div class="input-group">
            <label for="orientation">Orientation</label>
            <select id="orientation" onchange="generateTable()">
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="rows">Number of Rows</label>
            <input type="number" id="rows" min="1" value="10">
        </div>
        
        <div class="input-group">
            <label for="cols">Number of Columns</label>
            <input type="number" id="cols" min="1" value="5">
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="generateTable()" style="animation: pulseGlow 3s infinite;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Calculate & Generate
            </button>
            <div class="row-buttons" id="action-buttons" style="display: none;">
                <button class="btn-success" onclick="downloadPDF()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download PDF
                </button>
                <button class="btn-secondary" onclick="window.print()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print
                </button>
            </div>
        </div>

        <div class="results" id="results">
            <strong>Dimensions Generated:</strong><br>
            <span style="color: var(--text-muted);">Width:</span> <span id="cell-width" style="color: white; font-weight: bold;"></span> mm<br>
            <span style="color: var(--text-muted);">Height:</span> <span id="cell-height" style="color: white; font-weight: bold;"></span> mm<br>
            <span style="color: var(--text-muted);">Paper Size:</span> <em id="paper-size-display" style="color: var(--accent-green);"></em>
        </div>
    </div>

    <!-- The actual A4 page representation wrapped for glow effects -->
    <div class="a4-wrapper">
        <div class="a4-container" id="a4-preview"></div>
    </div>

    <script>
        function generateTable() {
            const rows = parseInt(document.getElementById('rows').value);
            const cols = parseInt(document.getElementById('cols').value);
            const orientation = document.getElementById('orientation').value;

            if (isNaN(rows) || isNaN(cols) || rows < 1 || cols < 1) {
                alert("Please enter valid positive numbers for both rows and columns.");
                return;
            }

            // Determine dimensions based on orientation
            const A4_WIDTH_MM = orientation === 'portrait' ? 210 : 297;
            const A4_HEIGHT_MM = orientation === 'portrait' ? 297 : 210;

            // Calculate exact sizes
            const cellWidth = (A4_WIDTH_MM / cols).toFixed(2);
            const cellHeight = (A4_HEIGHT_MM / rows).toFixed(2);

            // Update UI
            document.getElementById('cell-width').innerText = cellWidth;
            document.getElementById('cell-height').innerText = cellHeight;
            document.getElementById('paper-size-display').innerText = `${A4_WIDTH_MM}mm x ${A4_HEIGHT_MM}mm (${orientation})`;
            document.getElementById('results').style.display = 'block';
            
            // Fade in action buttons gracefully
            const actionBtns = document.getElementById('action-buttons');
            actionBtns.style.display = 'flex';
            actionBtns.style.animation = 'fadeInUp 0.4s ease forwards';

            // Update Preview Container Size - Triggers CSS Transition Animation
            const preview = document.getElementById('a4-preview');
            preview.style.width = `${A4_WIDTH_MM}mm`;
            preview.style.height = `${A4_HEIGHT_MM}mm`;

            // Update Print Styles dynamically
            updatePrintStyles(orientation);

            // Generate Table HTML
            // Re-triggering the table animation by re-inserting the element
            let tableHTML = '<table>';
            for (let i = 0; i < rows; i++) {
                tableHTML += '<tr>';
                for (let j = 0; j < cols; j++) {
                    tableHTML += `<td style="width: ${cellWidth}mm; height: ${cellHeight}mm;"></td>`;
                }
                tableHTML += '</tr>';
            }
            tableHTML += '</table>';

            // Brief timeout forces the browser to restart the table fade-in animation
            preview.innerHTML = '';
            setTimeout(() => {
                preview.innerHTML = tableHTML;
            }, 10);
        }

        // Dynamically forces the browser print dialog to switch between portrait/landscape
        function updatePrintStyles(orientation) {
            let style = document.getElementById('dynamic-print-style');
            if (!style) {
                style = document.createElement('style');
                style.id = 'dynamic-print-style';
                document.head.appendChild(style);
            }
            style.innerHTML = `@media print { @page { size: A4 ${orientation}; margin: 0; } }`;
        }

        function downloadPDF() {
            const element = document.getElementById('a4-preview');
            const orientation = document.getElementById('orientation').value;
            
            // Configure PDF options, dynamically setting portrait/landscape
            const opt = {
                margin:       0,
                filename:     `Custom_Table_${orientation}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: orientation }
            };

            // Generate and download
            html2pdf().set(opt).from(element).save();
        }

        // Generate default table on load
        window.onload = generateTable;
    </script>

</body>
</html>
